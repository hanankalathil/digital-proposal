<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/proposal-animation.css">
    <link rel="stylesheet" href="/css/photo-puzzle.css">
    <style>
        /* Scratch Card Canvas Styles */
        #scratch-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: transparent;
        }
        #landing-content {
            position: absolute;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        #scratch-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            cursor: crosshair;
        }
        
        /* Animated Overlay Text */
        #scratch-overlay-text {
            position: absolute;
            z-index: 3;
            pointer-events: none;
            color: #FFFFFF;
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            text-shadow: 0 2px 15px rgba(0, 0, 0, 0.4);
            animation: pulseText 2.5s ease-in-out infinite;
            transition: opacity 0.5s ease;
        }
        
        @keyframes pulseText {
            0% { opacity: 0.7; transform: scale(0.98); text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
            50% { opacity: 1; transform: scale(1.02); text-shadow: 0 2px 20px rgba(255,255,255,0.2), 0 2px 15px rgba(0,0,0,0.5); }
            100% { opacity: 0.7; transform: scale(0.98); text-shadow: 0 2px 10px rgba(0,0,0,0.3); }
        }

        /* Heart particles animation for romance */
        .heart {
            position: absolute;
            color: var(--color-rose);
            font-size: 24px;
            pointer-events: none;
            animation: floatUp 2.5s ease-out forwards;
            z-index: 3;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5); opacity: 1; }
            50% { transform: translateY(-50px) scale(1.2); opacity: 0.8; }
            100% { transform: translateY(-100px) scale(1); opacity: 0; }
        }
    </style>
</head>
<body class="no-scroll">

    <!-- Scratch Reveal Screen -->
    <div id="landing">
        <div class="landing-background"></div>
        
        <div class="landing-header">
            <button id="landing-back-btn" class="nav-btn"></button>
            <p id="landing-small-intro" class="handwritten"></p>
            <h1 id="landing-title"></h1>
            <p id="landing-support-text"></p>
        </div>

        <div class="landing-content-wrapper">
            <div id="scratch-card-container">
                <!-- Hidden Content -->
                <div class="hidden-memory">
                    <div class="memory-photo-wrapper">
                        <img id="memory-photo" src="" alt="Memory">
                    </div>
                    <div class="memory-details">
                        <p id="memory-message" class="handwritten"></p>
                        <p id="memory-caption"></p>
                        <span id="memory-date"></span>
                    </div>
                </div>
                
                <!-- Scratch Surface -->
                <canvas id="scratch-canvas"></canvas>
                <div id="scratch-instruction"></div>
            </div>
        </div>

        <div class="landing-footer">
            <div id="scratch-progress-container">
                <span id="scratch-progress-text">0% revealed</span>
                <div class="progress-bar">
                    <div id="scratch-progress-fill"></div>
                </div>
            </div>
            <button id="landing-continue-btn" class="continue-btn hidden"></button>
            <button id="reveal-skip-btn" class="skip-btn">Reveal without scratching</button>
        </div>
    </div>

    <!-- Navigation & Music -->
    <header>
        <div class="music-player" id="music-player-btn">
            <button id="music-toggle" class="music-btn">
                <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <svg id="icon-pause" viewBox="0 0 24 24" style="display:none;"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg>
            </button>
            <div class="music-status" id="music-status">
                <div class="music-dots">
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>
            </div>
        </div>
    </header>
    <audio id="bg-music" loop></audio>

    <!-- Main Content -->
    <section class="hero reveal-on-scroll">
        <div class="hero-photo-wrapper">
            <img id="hero-img" class="hero-photo" src="" alt="Hero">
        </div>
        <h3 id="hero-small" class="handwritten"></h3>
        <h1 id="hero-large"></h1>
    </section>

    <section class="gallery-section reveal-on-scroll">
        <p id="gallery-text-1" class="memory-text"></p>
        <div class="gallery">
            <div class="gallery-item">
                <img src="/assets/photos/Screenshot_2026-09-03_203807.png" alt="Memory">
            </div>
            <div class="gallery-item">
                <img src="/assets/photos/Screenshot_2026-09-03_203822.png" alt="Memory">
            </div>
            <div class="gallery-item">
                <img src="/assets/photos/Screenshot_2026-09-03_203831.png" alt="Memory">
            </div>
            <div class="gallery-item">
                <img src="/assets/photos/Screenshot_2026-09-03_203841.png" alt="Memory">
            </div>
        </div>
        <p id="gallery-text-2" class="memory-text"></p>
    </section>

<section class="puzzle-section" aria-labelledby="puzzle-title">
 <div class="puzzle-card">
  <span class="puzzle-eyebrow">A LITTLE SURPRISE</span>
  <h2 id="puzzle-title">Piece together a memory 💗</h2>
  <p class="puzzle-subtitle">Tap a tile beside the empty space to complete the picture.</p>
  <div id="memory-puzzle" class="memory-puzzle" role="group" aria-label="Sliding photo puzzle"></div>
  <p id="puzzle-status" class="puzzle-status" role="status" aria-live="polite">Can you solve it?</p>
  <div class="puzzle-actions"><button id="puzzle-shuffle" type="button">Shuffle again</button><button id="puzzle-hint" type="button">Show picture</button></div>
  <div id="puzzle-preview" class="puzzle-preview" hidden><img src="/assets/photos/Screenshot_2026-09-03_203807.png" alt="Completed memory photo" loading="lazy"></div>
 </div>
</section>
    <section class="timeline-section reveal-on-scroll">
        <div id="timeline-container" class="timeline-container">
            <!-- Populated by JS -->
        </div>
    </section>

    <section class="letter-section reveal-on-scroll">
        <h2 id="letter-title"></h2>
        <div class="letter-wrapper">
            <button id="letter-btn" class="btn-primary"></button>
            <div id="letter-content" class="letter-content"></div>
        </div>
    </section>

    <section class="envelope-section reveal-on-scroll">
        <p id="envelope-prompt" class="handwritten"></p>
        <div id="envelope" class="envelope">
            <div id="envelope-paper" class="envelope-paper"></div>
        </div>
    </section>

    <section class="final-section reveal-on-scroll">
        <img id="final-img" class="final-photo" src="" alt="Final">
        <p id="final-text-1"></p>
        <h2 id="final-emoji"></h2>
        <p id="final-text-2"></p>
    </section>
    
    <section class="proposal-section reveal-on-scroll">
        <h2 class="proposal-title">Will you be mine, Ziya?</h2>
        <h1 class="proposal-question">Forever and always, my Suttumani.</h1>
<div id="proposal-animation" class="proposal-animation proposal-3d" aria-label="3D animated proposal scene" hidden>
  <div class="proposal-3d-frame">
    <img class="proposal-3d-image" src="/proposal-3d.webp" alt="3D animated-style young man kneeling with pink roses for Ziya under fairy lights" loading="lazy" decoding="async" width="880" height="1008" />
    <div class="proposal-3d-sparkles" aria-hidden="true"><span>♥</span><span>✦</span><span>♥</span><span>✧</span><span>♥</span><span>✦</span></div>
  </div>
  <p class="proposal-animation-caption">On one knee, with flowers for Ziya! 💗</p>
</div>
        <div class="proposal-buttons">
            <button id="btn-yes" class="btn-proposal btn-yes">Yes</button>
            <button id="btn-no" class="btn-proposal btn-no">No</button>
        </div>
    </section>

    <!-- Subtle swipe-up gesture shown once after Continue -->
    <div id="swipe-hint" class="swipe-hint" hidden aria-hidden="true">
      <div class="swipe-hint-trail"></div>
      <svg class="swipe-hint-finger" viewBox="0 0 70 105" fill="none" aria-hidden="true">
        <path d="M28 91 14 67c-4-7 5-13 10-7l8 10V21c0-9 14-9 14 0v33c4-7 14-5 14 3 6-4 13 1 11 8l-5 26c-2 9-10 13-19 13H41c-6 0-10-4-13-13Z" transform="translate(-5 -2) scale(.94)" fill="#fffaf8" stroke="#986c79" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M27 19c-3-8 1-16 9-18m9 4c5 3 8 8 8 14" stroke="#c68fa1" stroke-width="2" stroke-linecap="round" opacity=".8"/>
      </svg>
    </div>
    <!-- Lightbox -->
    <div id="lightbox" class="lightbox">
        <button id="lightbox-close" class="lightbox-close">&times;</button>
        <img id="lightbox-img" src="" alt="Lightbox">
    </div>

    <!-- Scripts -->
    <script src="/js/config.js"></script>
    <script src="/js/app.js"></script>
    <script defer src="/js/photo-puzzle.js"></script>
</body>
</html>
